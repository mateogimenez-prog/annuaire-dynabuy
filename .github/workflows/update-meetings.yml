name: Mise à jour des réunions

on:
  schedule:
    - cron: '0 */4 * * *'  # Toutes les 4h : 1h, 5h, 9h, 13h, 17h, 21h UTC
  workflow_dispatch:        # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Fetch meetings
        run: node scripts/fetch-meetings.js

      - name: Commit & push si changement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet app.js; then
            git add app.js
            git commit -m "chore: mise à jour automatique des réunions [$(date +'%Y-%m-%d')]"
            git push
          else
            echo "Aucun changement, pas de commit"
          fi
